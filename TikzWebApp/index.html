
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikZ AI Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.3s ease-out',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for a better dark/light mode aesthetic */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9; /* slate-100 for light mode */
    }
    .dark ::-webkit-scrollbar-track {
      background: #1e293b; /* slate-800 for dark mode */
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8; /* slate-400 for light mode */
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569; /* slate-600 for dark mode */
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b; /* slate-500 for both modes */
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
