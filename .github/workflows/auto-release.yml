name: Build & Publish MatrixExamAI Pro Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Publish MatrixExamAI Desktop (.NET 10)
        run: |
          dotnet publish desktop_csharp\src\MatrixExamAI.Desktop\MatrixExamAI.Desktop.csproj -c Release -r win-x64 --self-contained false -o desktop_csharp\publish
          Compress-Archive -Path "desktop_csharp\publish\MatrixExamAI.Desktop.dll", "desktop_csharp\publish\MatrixExamAI.Desktop.exe", "desktop_csharp\publish\MatrixExamAI.Shared.dll", "desktop_csharp\publish\MatrixExamAI.Desktop.deps.json", "desktop_csharp\publish\MatrixExamAI.Desktop.runtimeconfig.json" -DestinationPath "dist\installer\MatrixExamAI_Patch.zip" -Force

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_pro.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/installer/MatrixExamAI_Pro_Setup.exe
            dist/installer/MatrixExamAI_Patch.zip
          name: "MatrixExamAI Pro ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
