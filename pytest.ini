[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*invalid escape sequence.*:SyntaxWarning
markers =
    slow: tests that are slow (use `pytest -m "not slow"` to skip)
    docx: tests that need real .docx files (may not be present in CI)
    ai:   tests that need API keys (skipped without env vars)
addopts =
    -ra
    --strict-markers
    --tb=short
